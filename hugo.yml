baseURL: "https://lau.blog.br/"
title: "∼{L4u}.blog.br"
theme: "PaperMod"
defaultContentLanguage: "pt"
defaultContentLanguageInSubdir: false
disableDefaultLanguageRedirect: false
googleAnalytics: "G-MP0WQ14YRL"
taxonomies:
  category: "categories"
  tag: "tags"
languages:
  en:
    disabled: false
    contentDir: "content/en"
    languageCode: "en-US"
    languageDirection: "ltr"
    languageName: "🇺🇸"
    # title: "∼{l4u}.blog.br"
    menus:
      main:
        - identifier: categories
          name: Categories
          url: /categories
        - identifier: tags
          name: Tags
          url: /tags
    params:
      homeInfoParams:
        Title:
        Content: Hi! I'm Laudivan. I've been recording here must of my soul as chronicles, poetry, thoughts and draws. I hope you enjoy It! 🫶🏾
      subtitle: "A place for my thoughts, archievements and more..."
      keywords: ["blog", "PaperMod"]
      dateFormat: "January 2, 2006"
      editPost:
        URL: "https://github.com/laudivan/lau.blog.br/blob/publish/content/en"
        Text: "Comments" # edit text
        appendFilePath: true # to append file path to Edit link
  pt:
    disabled: false
    contentDir: "content/pt"
    languageCode: "pt-BR"
    languageDirection: "ltr"
    languageName: "🇧🇷"
    # title: "∼{l4u}.blog.br"
    menus:
      main:
        - identifier: categories
          name: Categorias
          url: /categories
        - identifier: tags
          name: Tags
          url: /tags
    params:
      homeInfoParams:
        Title:
        Content: Olá! Eu sou Laudivan (Tio Lau). Tenho registrado aqui muito da minha alma em crônicas, poesias, pensamentos e desenhos. Espero que goste. 🫶🏾
      subtitle: "Um lugar para meus pensamentos, realizações e mais..."
      keywords: ["blog", "PaperMod", "pensamentos", "reflexões", "crônicas"]
      dateFormat: "2 de Janeiro de 2006"
      editPost:
        URL: "https://github.com/laudivan/lau.blog.br/blob/publish/content/pt"
        Text: "Comentários" # edit text
        appendFilePath: true # to append file path to Edit link

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

sitemap:
  changeFreq: hourly

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: "∼{l4u}.blog.br"
  author: 
    name: "∼{l4u}"
    avatar: "/static/avatar.jpg"
    avatarSize: "size-m"
    email: "me@lau.blog.br"
    avatarFirst: false
  # author: ["Me", "You"] # multiple authors
  # images: ["<link or path of image for opengraph, twitter-cards>"]
  defaultTheme: auto # dark, light
  disableThemeToggle: false
  displayFullLangName: true
  showMetadata: true
  showAuthors: true
  openLinksInNewTab: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.ico"
    favicon32x32: "/favicon.ico"
    apple_touch_icon: "/apple-touch-icon-512x512.png"
    safari_pinned_tab: "/l4u.svg"

  label:
    text: "∼{l4u}.blog.br"
#    icon: /apple-touch-icon-512x512.png
#    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  socialIcons:
    - name: github
      url: "https://github.com/laudivan"
    - name: mastodon
      url: "https://mastodon.social/@l4u"
    - name: matrix
      url: "https://matrix.to/#/@laudivan:fedora.im"
  analytics:
    bing:
      SiteVerificationTag: "G-MP0WQ14YRL"
    yandex:
      SiteVerificationTag: "f5a75c627a53006e"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

privacy:
  youTube:
    disable: false
    privacyEnhanced: true

